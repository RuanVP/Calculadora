<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
        <style>
            *{
                margin: 0;
                padding: 0;
            }
            .fundo{
                    background-image: linear-gradient(45deg, #ff0000, #000000);
                    height: 100vh;
                    color: white;
                    font-family: Arial, Helvetica, sans-serif;
                    text-align: center;
            }
            .calculadora{
                position: absolute;
                color: white;
                background-color: rgba(0, 0, 0, 0.85);
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                border-radius: 15px;
                padding: 15px;
                text-align: center;
            }
            .botao{
                width: 50px;
                height: 50px;
                border-radius: 10px;
                background-color: #4b4b4b;
                color: white;
                font-size: 20px;
                cursor: pointer;
                border:none;
            }
            .botao:hover{
                background-color: #3a3535;
            }
            #resultado{
                background-color: white ;
                color: black;
                width: 200px;
                height: 15px;
                margin: 5px auto;
                fonte-size: 10px;
                color: black;
                text-align: right;
                padding: 5px;
                text-transform: uppercase;
            }
        </style>
<body>
    <div class = "fundo">
        <h1>Ruan Vitor</h1>
    </div>
    <div class = "calculadora">
        <h1>Calculadora</h1>
        <p id = "resultado">resultado</p>
        <table>
                <tr>
                    <td><button class = "botao" onclick="limpar()">C</button></td>
                    <td><button class = "botao" onclick="voltar()"><</button></td>
                    <td><button class = "botao" onclick="inserir('/')">/</button></td>
                    <td><button class = "botao" onclick="inserir('*')">X</button></td>
                </tr>
                <tr>
                    <td><button class = "botao" onclick="inserir('7')">7</button></td>
                    <td><button class = "botao" onclick="inserir('8')">8</button></td>
                    <td><button class = "botao" onclick="inserir('9')">9</button></td>
                    <td><button class = "botao" onclick="inserir('-')">-</button></td>
                </tr>
                <tr>
                    <td><button class = "botao" onclick="inserir('4')">4</button></td>
                    <td><button class = "botao" onclick="inserir('5')">5</button></td>
                    <td><button class = "botao" onclick="inserir('6')">6</button></td>
                    <td><button class = "botao" onclick="inserir('+')">+</button></td>
                </tr>
                <tr>
                    <td><button class = "botao" onclick="inserir('1')">1</button></td>
                    <td><button class = "botao" onclick="inserir('2')">2</button></td>
                    <td><button class = "botao" onclick="inserir('3')">3</button></td>
                    <td rowspan="2"><button class = "botao" style = "height: 106px;" onclick="calcular()">=</button></td>
                </tr>
                <tr>
                    <td colspan="2"><button class = "botao" style = "width: 106px;" onclick="inserir('0')">0</button></td>
                    <td><button class = "botao" onclick="inserir('.')">.</button></td>
                </tr>
            </table>
        </div>
    </div>
    <script>
        function inserir(num)
        {
           var numero =document.getElementById('resultado').innerHTML;
              document.getElementById('resultado').innerHTML = numero + num;
        }
        function limpar()
        {
            document.getElementById('resultado').innerHTML = "";
        }
        function voltar()
        {
            var resultado = document.getElementById('resultado').innerHTML;
            document.getElementById('resultado').innerHTML = resultado.substring(0, resultado.length - 1);
        }
        function calcular()
        {
        var resultado = document.getElementById('resultado').innerHTML;
        if (resultado)
          {  
            document.getElementById('resultado').innerHTML = eval(resultado);
          }  
          else
          {
            document.getElementById('resultado').innerHTML = "0";
          }
    }
    </script>
</body>
</html>
            
        
</body>
</html>
